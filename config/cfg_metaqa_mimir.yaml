# Fine-tune of the cfg_graphqa_mimir model on MetaQA (vanilla, GRL's regenerated baseline of 2026-09-28: data/graphs/metaqa/baseline-grl), GRL prompt ("#### Question\n" + question).
# Same recipe as cfg_graphqa_mimir except 3 epochs: GRL's runs peaked at epoch 2-3 on MetaQA / KQA Pro, and one epoch is
# 8-10x a GraphQA epoch. In-training val twice per epoch; the val set is sampled with 8 epochs (>= one per call) and
# needs ~95-125 batches, below validation_batches.
# Driver: scripts/graphs/run_kgqa_finetunes.sh
defaults:
  - cfg_graphqa_mimir
  - _self_

wandb_group: metaqa-mimir

data:
  path: data/graphs/sampled/metaqa_mimir_e3
  validation_path: data/graphs/sampled/metaqa_mimir_val_e8
epochs: 3
validation_interval: 470
validation_batches: 160
