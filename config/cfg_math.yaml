# From-scratch MATH (direct answers) for the L/H ablation. data.path=data/graphs/sampled/math_e30 (scripts/graphs/prepare_benchmark_data.py --benchmark math).
# Same model/optimizer recipe as cfg_graphqa.yaml; only data, epochs and W&B project differ.
# NOTE: scripts/graphs/prepare_dataset.sh must be run with <epochs> equal to `epochs` here.
defaults:
  - cfg_graphqa
  - _self_

project_name: HRM-MATH-Ablation

epochs: 30
checkpoint_interval: 10
