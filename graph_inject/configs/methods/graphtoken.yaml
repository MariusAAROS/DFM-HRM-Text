# GraphToken + text ("Graph Tokens + Text", Less is More): GIN over RWSE + LapPE node features -> 8 graph-level soft
# tokens in front of the unchanged graph text, + LoRA. See graphtoken-faithful for GraphToken's own setting.
name: graphtoken
kind: graph_token
num_tokens: 8
gnn_hidden: 256
gnn_layers: 3
rwse_steps: 16
lap_k: 8
