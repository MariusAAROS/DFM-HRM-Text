# GraphToken + text with a frozen LLM: only the GNN and readout train, the graph text is kept (so not GraphToken's
# original setting, which has no graph text: graphtoken-faithful).
name: graphtoken-frozen
kind: graph_token
num_tokens: 8
gnn_hidden: 256
gnn_layers: 3
rwse_steps: 16
lap_k: 8
train: {regime: frozen}
