# Shared recipe. Datasets: configs/datasets/*.yaml (data, epochs, out_root, W&B group), models: configs/models/*.yaml,
# methods: configs/methods/*.yaml (a method's `train:` block overrides these keys, e.g. the full-FT check).
# CLI: key=value (OmegaConf dotlist).
seed: 0
accelerator_type: sm120
regime: lora              # lora | frozen | full
lora: {rank: 16, alpha: 32}
optimizer: adamw          # adamw | adam_atan2
betas: [0.9, 0.999]
lr: 2.0e-4                # LoRA (or full-FT) learning rate
method_lr: 1.0e-3         # the method's own modules (GNN, projectors, prompt encoder)
weight_decay: 0.0
warmup_steps: 20          # linear warmup, then constant (as cfg_graphqa_hrm1b)
grad_clip: 1.0
tokens_per_step: 8192     # packed PrefixLM batch, as cfg_graphqa_hrm1b
samples_per_step: null    # also cap the samples per batch (the no-graph-text arms: short prompts, else few steps)
max_steps: null           # stop early (benchmarks / smoke tests)
log_every: 10
eval: {max_generation: 96, batch_size: 16, val_subset: null, limit: null}  # val_subset: N val samples per epoch
data: {limit: null}       # first N rows of every split (smoke runs)
wandb: {project: Graph-Positional-Encoding-Exploration, mode: online}
